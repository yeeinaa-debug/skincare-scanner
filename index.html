<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<title>yeeinaa Skincare Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F2;
    --paper:#FFFDFB;
    --ink:#241F1D;
    --ink-soft:#5B534D;
    --berry:#B23A5C;
    --berry-deep:#8C2A47;
    --sage:#7C8B6F;
    --clay:#E8DDD0;
    --clay-line:#DCD0C0;
    --amber:#C98A3E;
    --amber-bg:#FBEEDC;
    --radius:14px;
    --shadow: 0 1px 2px rgba(36,31,29,0.04), 0 8px 24px -12px rgba(36,31,29,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #F3E7DE 0%, transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
  }
  ::selection{background:var(--berry); color:#fff;}

  /* ---------- header ---------- */
  header.top{
    padding:calc(28px + env(safe-area-inset-top)) 20px 18px;
    max-width:640px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--berry-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--sage);
    display:inline-block;
  }
  h1.brand{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:34px;
    line-height:1.05;
    margin:6px 0 2px;
    letter-spacing:-0.01em;
  }
  h1.brand em{
    font-style:italic;
    font-weight:400;
    color:var(--berry);
  }
  .sub{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
  }

  /* ---------- tabs ---------- */
  nav.tabs{
    max-width:640px;
    margin:18px auto 0;
    padding:0 20px;
    display:flex;
    gap:6px;
  }
  nav.tabs button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:.04em;
    background:transparent;
    border:1px solid var(--clay-line);
    color:var(--ink-soft);
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  nav.tabs button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--cream);
  }
  nav.tabs button:not(.active):hover{
    border-color:var(--berry);
    color:var(--berry-deep);
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:22px 20px 0;
  }
  section.view{display:none;}
  section.view.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

  /* ---------- card shell ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--clay-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- scan mode switch ---------- */
  .mode-switch{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .mode-switch button{
    font-family:'IBM Plex Sans';
    font-weight:500;
    font-size:14px;
    padding:14px 10px;
    border-radius:12px;
    border:1px solid var(--clay-line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    transition:all .15s ease;
  }
  .mode-switch button .ic{font-size:20px;}
  .mode-switch button.active{
    border-color:var(--berry);
    color:var(--berry-deep);
    background:#FDF1F4;
    box-shadow:0 0 0 3px rgba(178,58,92,0.08);
  }

  /* ---------- scanner box ---------- */
  #reader-wrap{
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--clay-line);
    background:#111;
    position:relative;
    margin-bottom:14px;
  }
  #reader{width:100%;}
  .scan-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
    padding:8px 0 16px;
  }
  .lookup-status{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:10px 14px;
    border-radius:10px;
    margin-bottom:14px;
    display:none;
  }
  .lookup-status.show{display:block;}
  .lookup-status.ok{background:#EEF3EA; color:#4B5A3D;}
  .lookup-status.miss{background:var(--amber-bg); color:#8A5A1E;}
  .lookup-status.loading{background:var(--clay); color:var(--ink-soft);}

  /* ---------- photo capture ---------- */
  .photo-drop{
    border:1.5px dashed var(--clay-line);
    border-radius:var(--radius);
    padding:26px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    cursor:pointer;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
    background:var(--paper);
  }
  .photo-drop:hover{border-color:var(--berry);}
  .photo-drop img{
    max-width:100%;
    max-height:220px;
    border-radius:10px;
    display:block;
    margin:0 auto;
  }
  .photo-drop input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .photo-drop .ic{font-size:26px; display:block; margin-bottom:6px;}

  /* ---------- form ---------- */
  .form-card{padding:20px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=date],
  .field select{
    width:100%;
    font-family:'IBM Plex Sans';
    font-size:15px;
    padding:11px 12px;
    border-radius:9px;
    border:1px solid var(--clay-line);
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--berry);
    box-shadow:0 0 0 3px rgba(178,58,92,0.10);
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--clay-line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
    transition:all .12s ease;
  }
  .chip.picked{
    background:var(--sage);
    border-color:var(--sage);
    color:#fff;
  }
  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1;
    font-family:'IBM Plex Sans';
    font-size:13.5px;
    font-weight:500;
    padding:10px;
    border-radius:9px;
    border:1px solid var(--clay-line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .seg button.picked{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--cream);
  }

  .save-btn{
    width:100%;
    margin-top:6px;
    padding:15px;
    border:none;
    border-radius:11px;
    background:var(--berry);
    color:#fff;
    font-family:'IBM Plex Sans';
    font-weight:600;
    font-size:15px;
    letter-spacing:.01em;
    cursor:pointer;
    transition:background .15s ease, transform .08s ease;
  }
  .save-btn:hover{background:var(--berry-deep);}
  .save-btn:active{transform:scale(.99);}
  .save-btn:disabled{background:var(--clay-line); cursor:not-allowed;}
  .toast{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    text-align:center;
    color:var(--sage);
    margin-top:10px;
    min-height:16px;
  }

  /* ---------- collection view ---------- */
  .search-bar{
    display:flex; gap:8px;
    margin-bottom:16px;
  }
  .search-bar input{
    flex:1;
    font-family:'IBM Plex Sans';
    font-size:14.5px;
    padding:11px 13px;
    border-radius:9px;
    border:1px solid var(--clay-line);
    background:var(--paper);
  }
  .filter-row{
    display:flex; gap:8px; overflow-x:auto;
    margin-bottom:16px;
    padding-bottom:2px;
  }
  .filter-row .chip{white-space:nowrap;}
  .stats-strip{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:18px;
  }
  .stat{
    background:var(--paper);
    border:1px solid var(--clay-line);
    border-radius:12px;
    padding:12px 10px;
    text-align:center;
  }
  .stat b{
    display:block;
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:600;
  }
  .stat span{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .product-list{display:flex; flex-direction:column; gap:10px;}
  .product{
    background:var(--paper);
    border:1px solid var(--clay-line);
    border-radius:12px;
    padding:14px 14px 14px 16px;
    position:relative;
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-left:3px solid var(--clay-line);
  }
  .product.warn{border-left-color:var(--amber);}
  .product.soon{border-left-color:var(--berry);}
  .product .pname{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    line-height:1.25;
  }
  .product .pmeta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
    display:flex; flex-wrap:wrap; gap:6px 10px;
  }
  .tag-label{
    align-self:flex-start;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.04em;
    padding:4px 8px;
    border-radius:6px;
    background:var(--clay);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .product.warn .tag-label{background:var(--amber-bg); color:#8A5A1E;}
  .product.soon .tag-label{background:#FDF1F4; color:var(--berry-deep);}
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:40px 10px;
    font-family:'IBM Plex Mono', monospace;
  }

  footer.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--paper);
    border-top:1px solid var(--clay-line);
    display:flex;
    padding:8px 14px calc(10px + env(safe-area-inset-bottom));
    gap:6px;
    max-width:640px;
    margin:0 auto;
  }
  footer.tabbar button{
    flex:1;
    background:none;
    border:none;
    font-family:'IBM Plex Sans';
    font-size:11.5px;
    color:var(--ink-soft);
    padding:6px 0 2px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  footer.tabbar button .ic{font-size:19px;}
  footer.tabbar button.active{color:var(--berry-deep);}
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">yeeinaa · products lab</div>
  <h1 class="brand">Skincare <em>Scanner</em></h1>
  <p class="sub">Catat produk baru, lacak expired date, semua kekumpul rapi.</p>
</header>

<main>

  <!-- ADD VIEW -->
  <section class="view active" id="view-add">
    <div class="mode-switch">
      <button id="mode-barcode" class="active"><span class="ic">▤</span>Scan barcode</button>
      <button id="mode-manual"><span class="ic">✎</span>Foto / manual</button>
    </div>

    <!-- barcode mode -->
    <div id="panel-barcode">
      <div id="reader-wrap">
        <div id="reader"></div>
      </div>
      <div class="scan-hint" id="scan-hint">arahkan kamera ke barcode kemasan</div>
      <div class="lookup-status" id="lookup-status"></div>
    </div>

    <!-- manual / photo mode -->
    <div id="panel-manual" style="display:none;">
      <label class="photo-drop" id="photo-drop">
        <span id="photo-placeholder">
          <span class="ic">📷</span>
          tap buat ambil / upload foto produk
        </span>
        <img id="photo-preview" style="display:none;" />
        <input type="file" accept="image/*" capture="environment" id="photo-input" />
      </label>

      <div class="card" style="padding:14px; margin-bottom:16px;">
        <label style="display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;">Atau cari nama produk</label>
        <input type="text" id="name-search-input" placeholder="ketik nama produk..." style="width:100%; font-family:'IBM Plex Sans'; font-size:14.5px; padding:11px 13px; border-radius:9px; border:1px solid var(--clay-line); background:var(--paper);" />
        <div id="name-search-results" style="margin-top:10px; display:flex; flex-direction:column; gap:6px;"></div>
        <div id="name-search-status" style="font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); margin-top:8px;"></div>
      </div>
    </div>

    <!-- shared form (fills after barcode hit, or manual) -->
    <div class="card form-card" id="form-card" style="display:none;">
      <div class="field">
        <label>Nama produk</label>
        <input type="text" id="f-name" placeholder="cth. PDRN Hyaluronic Acid Serum" />
      </div>
      <div class="row2">
        <div class="field">
          <label>Brand</label>
          <input type="text" id="f-brand" list="brand-list" placeholder="cth. Anua" />
          <datalist id="brand-list"></datalist>
        </div>
        <div class="field">
          <label>Tipe</label>
          <input type="text" id="f-type" list="type-list" placeholder="cth. Serum" />
          <datalist id="type-list"></datalist>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Jumlah</label>
          <input type="number" id="f-amount" value="1" min="0" />
        </div>
        <div class="field">
          <label>Expired date</label>
          <input type="date" id="f-expired" />
        </div>
      </div>
      <div class="field">
        <label>Kondisi</label>
        <div class="seg">
          <button type="button" class="seg-condition" data-v="New">New</button>
          <button type="button" class="seg-condition" data-v="Opened">Opened</button>
        </div>
      </div>
      <div class="field">
        <label>Lokasi</label>
        <div class="seg">
          <button type="button" class="seg-location" data-v="Daejeon">Daejeon</button>
          <button type="button" class="seg-location" data-v="Seoul">Seoul</button>
        </div>
      </div>
      <div class="field">
        <label>Skin concern (opsional, bisa lebih dari satu)</label>
        <div class="chips" id="concern-chips"></div>
      </div>
      <button class="save-btn" id="save-btn">Simpan ke koleksi</button>
      <div class="toast" id="save-toast"></div>
    </div>
  </section>

  <!-- COLLECTION VIEW -->
  <section class="view" id="view-collection">
    <div class="stats-strip" id="stats-strip"></div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="cari nama / brand..." />
    </div>
    <div class="filter-row" id="filter-row"></div>
    <div class="product-list" id="product-list"></div>
  </section>

  <!-- COLLABS VIEW -->
  <section class="view" id="view-collabs">
    <div class="card" style="padding:16px; margin-bottom:18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <div>
          <div class="pname" style="font-size:15px;">Google Calendar</div>
          <div id="gcal-status" style="font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); margin-top:2px;">belum connect</div>
        </div>
        <button id="gcal-connect-btn" style="font-family:'IBM Plex Sans'; font-weight:500; font-size:13px; padding:9px 16px; border-radius:9px; border:none; background:var(--ink); color:var(--cream); cursor:pointer; white-space:nowrap;">Connect</button>
      </div>
    </div>

    <div class="card form-card" style="margin-bottom:18px;">
      <div class="field">
        <label>Brand</label>
        <input type="text" id="c-brand" list="brand-list" placeholder="cth. Anua" />
      </div>
      <div class="field">
        <label>Produk / item endorse</label>
        <input type="text" id="c-product" list="product-list" placeholder="ketik/pilih dari koleksi, atau nama baru" />
        <datalist id="product-list"></datalist>
      </div>
      <div class="row2">
        <div class="field">
          <label>Platform</label>
          <input type="text" id="c-platform" placeholder="cth. Instagram Reels" />
        </div>
        <div class="field">
          <label>Status</label>
          <select id="c-status">
            <option>Received</option>
            <option>Planned</option>
            <option>Filmed</option>
            <option>Posted</option>
            <option>Paid</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Tanggal terima barang</label>
          <input type="date" id="c-received" />
        </div>
        <div class="field">
          <label>Deadline konten</label>
          <input type="date" id="c-deadline" />
        </div>
      </div>
      <div class="field">
        <label>Tanggal posting</label>
        <input type="date" id="c-post" />
      </div>
      <div class="field">
        <label>Catatan</label>
        <input type="text" id="c-notes" placeholder="opsional" />
      </div>
      <button class="save-btn" id="collab-save-btn">Simpan collab</button>
      <div class="toast" id="collab-toast"></div>
    </div>

    <div class="product-list" id="collab-list"></div>
  </section>

</main>

<footer class="tabbar">
  <button class="tab-btn active" data-view="view-add" id="tabbtn-add"><span class="ic">＋</span>Tambah</button>
  <button class="tab-btn" data-view="view-collection" id="tabbtn-collection"><span class="ic">▦</span>Koleksi</button>
  <button class="tab-btn" data-view="view-collabs" id="tabbtn-collabs"><span class="ic">◷</span>Collabs</button>
</footer>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const SUPABASE_URL = "https://xrwutimnlbfzwxjjxlxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_DOft66tlmt228oca4TDzGQ_SLvQsY_M";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CONCERNS = ["Sensitive Skin","Dry Skin","Oily Skin","Redness","Acne","Anti-Aging","Brightening","Pores","Wrinkles","Damaged Skin","Body Odor","Dark Circles","Dark Spots","Hyperpigmentation","Hydration"];

let pickedConcerns = new Set();
let pickedCondition = "New";
let pickedLocation = "Daejeon";
let photoDataUrl = null;
let scannedBarcode = null;

/* ---------------- tab nav ---------------- */
function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===id));
  if(id==="view-collection") loadCollection();
  if(id==="view-collabs") loadCollabs();
}
document.getElementById("tabbtn-add").onclick = ()=>showView("view-add");
document.getElementById("tabbtn-collection").onclick = ()=>showView("view-collection");
document.getElementById("tabbtn-collabs").onclick = ()=>showView("view-collabs");

/* ---------------- mode switch ---------------- */
const modeBarcode = document.getElementById("mode-barcode");
const modeManual = document.getElementById("mode-manual");
const panelBarcode = document.getElementById("panel-barcode");
const panelManual = document.getElementById("panel-manual");
const formCard = document.getElementById("form-card");

modeBarcode.onclick = ()=>{
  modeBarcode.classList.add("active"); modeManual.classList.remove("active");
  panelBarcode.style.display="block"; panelManual.style.display="none";
  startScanner();
};
modeManual.onclick = ()=>{
  modeManual.classList.add("active"); modeBarcode.classList.remove("active");
  panelManual.style.display="block"; panelBarcode.style.display="none";
  stopScanner();
  scannedBarcode = null;
  formCard.style.display="block";
};

/* ---------------- barcode scanning ---------------- */
let qrScanner = null;
let scannerRunning = false;

function startScanner(){
  if(scannerRunning) return;
  qrScanner = new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(cams=>{
    if(!cams || !cams.length){
      document.getElementById("scan-hint").textContent = "kamera ga ketemu — coba mode foto/manual";
      return;
    }
    const camId = cams.find(c=>/back|rear|environment/i.test(c.label))?.id || cams[cams.length-1].id;
    qrScanner.start(
      camId,
      { fps:10, qrbox:{width:250,height:130} },
      onBarcodeDetected,
      ()=>{}
    ).then(()=>{ scannerRunning = true; }).catch(()=>{
      document.getElementById("scan-hint").textContent = "ga bisa akses kamera — coba mode foto/manual";
    });
  }).catch(()=>{
    document.getElementById("scan-hint").textContent = "ga bisa akses kamera — coba mode foto/manual";
  });
}
function stopScanner(){
  if(qrScanner && scannerRunning){
    qrScanner.stop().catch(()=>{});
    scannerRunning = false;
  }
}

let lastCode = null;
async function onBarcodeDetected(code){
  if(code === lastCode) return;
  lastCode = code;
  scannedBarcode = code;
  const status = document.getElementById("lookup-status");
  status.className = "lookup-status show loading";
  status.textContent = `barcode ${code} — nyari di koleksi & database...`;

  // 1. cek dulu apakah barcode ini udah ada di koleksi sendiri
  try{
    const { data: existing } = await sb.from("products").select("id,product_name,brand,amount").eq("barcode", code).limit(1);
    if(existing && existing.length){
      const p = existing[0];
      status.className = "lookup-status show ok";
      status.textContent = `udah ada di koleksi: "${p.product_name}" (x${p.amount}) — kalau ini botol baru, lanjut isi expired date-nya, nanti disimpan sebagai baris terpisah`;
      openForm({ name:p.product_name, brand:p.brand||"", type:"" });
      return;
    }
  } catch(e){ /* ignore, lanjut ke lookup publik */ }

  // 2. belum ada, coba lookup publik buat autofill
  try{
    const res = await fetch(`https://world.openbeautyfacts.org/api/v0/product/${code}.json`);
    const data = await res.json();
    if(data.status === 1 && data.product){
      const p = data.product;
      status.className = "lookup-status show ok";
      status.textContent = `belum ada di koleksi. ketemu di database: ${p.product_name || "produk"} — cek & lengkapi di bawah`;
      openForm({
        name: p.product_name || "",
        brand: p.brands || "",
        type: ""
      });
    } else {
      status.className = "lookup-status show miss";
      status.textContent = "belum ada di koleksi, dan ga ketemu di database publik (wajar buat brand K-beauty niche) — isi manual di bawah ya";
      openForm({ name:"", brand:"", type:"" });
    }
  } catch(e){
    status.className = "lookup-status show miss";
    status.textContent = "belum ada di koleksi. gagal connect ke database publik — isi manual di bawah ya";
    openForm({ name:"", brand:"", type:"" });
  }
}

function openForm(prefill){

  document.getElementById("f-brand").value = prefill.brand || "";
  document.getElementById("f-type").value = prefill.type || "";

// concern chips
const chipsWrap = document.getElementById("concern-chips");
CONCERNS.forEach(c=>{
  const el = document.createElement("div");
  el.className = "chip";
  el.textContent = c;
  el.onclick = ()=>{

document.querySelectorAll(".seg-condition").forEach(b=>{

  };
});
document.querySelectorAll(".seg-location").forEach(b=>{
  if(b.dataset.v===pickedLocation) b.classList.add("picked");
  b.onclick = ()=>{
    document.querySelectorAll(".seg-location").forEach(x=>x.classList.remove("picked"));
    b.classList.add("picked");

document.getElementById("save-btn").onclick = async ()=>{
  const name = document.getElementById("f-name").value.trim();
  if(!name){
    document.getElementById("save-toast").textContent = "nama produk wajib diisi ya";
    document.getElementById("save-toast").style.color = "#B23A5C";
    return;
  }
  const btn = document.getElementById("save-btn");
  btn.disabled = true; btn.textContent = "menyimpan...";

  const payload = {
    product_name: name,
    brand: document.getElementById("f-brand").value.trim() || null,
    type: document.getElementById("f-type").value.trim() || null,

    expired_date: document.getElementById("f-expired").value || null,

function resetForm(){

  document.getElementById("f-brand").value = "";

  document.getElementById("f-expired").value = "";

  photoDataUrl = null;
  document.getElementById("photo-placeholder").style.display="";
  document.getElementById("photo-preview").style.display="none";
  document.getElementById("photo-input").value = "";

/* ---------------- brand / type autocomplete ---------------- */
let productNameMap = {}; // product_name (lowercase) -> {id, brand}
async function loadBrandTypeLists(){
  const { data } = await sb.from("products").select("id,product_name,brand,type");
  if(!data) return;
  const brands = [...new Set(data.map(d=>d.brand).filter(Boolean))].sort();
  const types = [...new Set(data.map(d=>d.type).filter(Boolean))].sort();
  document.getElementById("brand-list").innerHTML = brands.map(b=>`<option value="${b}">`).join("");
  document.getElementById("type-list").innerHTML = types.map(t=>`<option value="${t}">`).join("");

  productNameMap = {};
  data.forEach(p=>{
    if(p.product_name) productNameMap[p.product_name.toLowerCase()] = { id:p.id, brand:p.brand };
  });
  const productListEl = document.getElementById("product-list");
  if(productListEl){
    productListEl.innerHTML = data.filter(p=>p.product_name).map(p=>`<option value="${p.product_name}">`).join("");
  }
}

/* ---------------- collection view ---------------- */
let allProducts = [];
let activeFilter = null;

async function loadCollection(){
  document.getElementById("product-list").innerHTML = `<div class="empty">memuat koleksi...</div>`;
  const { data, error } = await sb.from("products").select("*").order("expired_date", { ascending: true, nullsFirst:false });
  if(error){
    document.getElementById("product-list").innerHTML = `<div class="empty">gagal muat: ${error.message}</div>`;
    return;
  }
  allProducts = data || [];
  renderStats();
  renderFilters();
  renderList();
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.ceil((d - now) / (1000*60*60*24));
}

function renderStats(){
  const total = allProducts.length;
  const expiringSoon = allProducts.filter(p=>{
    const d = daysUntil(p.expired_date);
    return d !== null && d <= 90 && d >= 0;
  }).length;
  const opened = allProducts.filter(p=>p.condition==="Opened").length;
  document.getElementById("stats-strip").innerHTML = `
    <div class="stat"><b>${total}</b><span>total produk</span></div>
    <div class="stat"><b>${expiringSoon}</b><span>expired &lt;90 hari</span></div>
    <div class="stat"><b>${opened}</b><span>lagi kepake</span></div>
  `;
}

function renderFilters(){
  const types = [...new Set(allProducts.map(p=>p.type).filter(Boolean))].sort();
  const row = document.getElementById("filter-row");
  row.innerHTML = "";
  const allChip = document.createElement("div");
  allChip.className = "chip" + (activeFilter===null ? " picked" : "");
  allChip.textContent = "Semua";
  allChip.onclick = ()=>{ activeFilter = null; renderFilters(); renderList(); };
  row.appendChild(allChip);
  types.forEach(t=>{
    const c = document.createElement("div");
    c.className = "chip" + (activeFilter===t ? " picked" : "");
    c.textContent = t;
    c.onclick = ()=>{ activeFilter = t; renderFilters(); renderList(); };
    row.appendChild(c);
  });
}

document.getElementById("search-input").addEventListener("input", renderList);

function renderList(){
  const q = document.getElementById("search-input").value.trim().toLowerCase();
  let list = allProducts;
  if(activeFilter) list = list.filter(p=>p.type===activeFilter);
  if(q) list = list.filter(p =>
    (p.product_name||"").toLowerCase().includes(q) ||
    (p.brand||"").toLowerCase().includes(q)
  );

  const wrap = document.getElementById("product-list");
  if(!list.length){
    wrap.innerHTML = `<div class="empty">ga ada produk yang cocok</div>`;
    return;
  }

  wrap.innerHTML = list.map(p=>{
    const d = daysUntil(p.expired_date);
    let cls = "", label = "";
    if(d === null){ label = "no expiry date"; }
    else if(d < 0){ cls="warn"; label = "sudah expired"; }
    else if(d <= 90){ cls="soon"; label = `${d} hari lagi`; }
    else { label = new Date(p.expired_date).toLocaleDateString("id-ID",{year:"numeric",month:"short"}); }

    const meta = [p.brand, p.type, p.amount ? `x${p.amount}` : null, p.location].filter(Boolean).join(" · ");

    return `
      <div class="product ${cls}">
        <div>
          <div class="pname">${escapeHtml(p.product_name)}</div>
          <div class="pmeta">${escapeHtml(meta)}</div>
        </div>
        <div class="tag-label">${label}</div>
      </div>
    `;
  }).join("");
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ---------------- search by name (Open Beauty Facts) ---------------- */
let searchDebounce = null;
document.getElementById("name-search-input").addEventListener("input", ()=>{
  clearTimeout(searchDebounce);
  const val = document.getElementById("name-search-input").value.trim();
  if(val.length < 3){
    document.getElementById("name-search-results").innerHTML = "";
    document.getElementById("name-search-status").textContent = val.length ? "ketik minimal 3 huruf..." : "";
    return;
  }
  document.getElementById("name-search-status").textContent = "nyari...";
  searchDebounce = setTimeout(searchByName, 500);
});

async function searchByName(){
  const q = document.getElementById("name-search-input").value.trim();
  const resultsWrap = document.getElementById("name-search-results");
  const statusEl = document.getElementById("name-search-status");
  resultsWrap.innerHTML = "";
  if(!q){ statusEl.textContent = "ketik nama produk dulu ya"; return; }

  statusEl.textContent = "nyari...";
  try{
    const url = `https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=6`;
    const res = await fetch(url);
    const data = await res.json();
    const products = (data.products || []).filter(p => p.product_name);

    if(!products.length){
      statusEl.textContent = "ga ketemu di database publik — isi manual aja di form bawah";
      return;
    }
    statusEl.textContent = `${products.length} hasil ditemukan, tap buat pilih:`;
    resultsWrap.innerHTML = products.map((p,i)=>`
      <div class="name-result" data-i="${i}" style="padding:10px 12px; border:1px solid var(--clay-line); border-radius:9px; cursor:pointer; font-size:13.5px;">
        <b>${escapeHtml(p.product_name)}</b>${p.brands ? " — " + escapeHtml(p.brands) : ""}
      </div>
    `).join("");

    resultsWrap.querySelectorAll(".name-result").forEach(el=>{
      el.onclick = ()=>{
        const p = products[Number(el.dataset.i)];
        scannedBarcode = p.code || null;
        openForm({ name: p.product_name || "", brand: p.brands || "", type: "" });
        statusEl.textContent = `dipilih: ${p.product_name}`;
        resultsWrap.innerHTML = "";
      };
    });
  } catch(e){
    statusEl.textContent = "gagal nyari — coba lagi atau isi manual";
  }
}

/* ---------------- Google Calendar ---------------- */
const GOOGLE_CLIENT_ID = "965668256942-q2cfs8hp30nn42qekp662vei8f9sd3qu.apps.googleusercontent.com";
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
let gTokenClient = null;
let gAccessToken = null;

function initGoogle(){
  if(!window.google || !google.accounts){ setTimeout(initGoogle, 300); return; }
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GCAL_SCOPE,
    callback: (resp)=>{
      if(resp && resp.access_token){
        gAccessToken = resp.access_token;
        document.getElementById("gcal-status").textContent = "connected ✓";
        document.getElementById("gcal-connect-btn").textContent = "Reconnect";
      }
    }
  });
}
document.getElementById("gcal-connect-btn").onclick = ()=>{
  if(!gTokenClient){ document.getElementById("gcal-status").textContent = "lagi loading, coba lagi sebentar"; return; }
  gTokenClient.requestAccessToken();
};

async function syncToCalendar(collab){
  if(!gAccessToken){
    alert("Connect ke Google Calendar dulu ya (tombol Connect di atas)");
    return;
  }
  if(!collab.post_date){
    alert("Isi tanggal posting dulu buat bisa sync ke calendar");
    return;
  }
  const event = {
    summary: `Post: ${collab.product_name || collab.brand} (${collab.platform || ""})`,
    description: `Brand: ${collab.brand}\nStatus: ${collab.status}\n${collab.notes || ""}`,
    start: { date: collab.post_date },
    end: { date: collab.post_date }
  };
  try{
    let res;
    if(collab.calendar_event_id){
      res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${collab.calendar_event_id}`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${gAccessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify(event)
      });
    } else {
      res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${gAccessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify(event)
      });
    }
    const data = await res.json();
    if(data.id){
      await sb.from("collabs").update({ calendar_event_id: data.id }).eq("id", collab.id);
      loadCollabs();
    } else {
      alert("gagal sync ke calendar: " + (data.error?.message || "unknown error"));
    }
  } catch(e){
    alert("gagal sync ke calendar");
  }
}

/* ---------------- collabs CRUD ---------------- */
document.getElementById("c-product").addEventListener("change", ()=>{
  const val = document.getElementById("c-product").value.trim().toLowerCase();
  const match = productNameMap[val];
  if(match && !document.getElementById("c-brand").value.trim()){
    document.getElementById("c-brand").value = match.brand || "";
  }
});

document.getElementById("collab-save-btn").onclick = async ()=>{
  const brand = document.getElementById("c-brand").value.trim();
  if(!brand){
    document.getElementById("collab-toast").style.color = "#B23A5C";
    document.getElementById("collab-toast").textContent = "brand wajib diisi ya";
    return;
  }
  const productNameVal = document.getElementById("c-product").value.trim();
  const matchedProduct = productNameMap[productNameVal.toLowerCase()];
  const payload = {
    brand,
    product_name: productNameVal || null,
    product_id: matchedProduct ? matchedProduct.id : null,
    platform: document.getElementById("c-platform").value.trim() || null,
    status: document.getElementById("c-status").value,
    received_date: document.getElementById("c-received").value || null,
    content_deadline: document.getElementById("c-deadline").value || null,
    post_date: document.getElementById("c-post").value || null,
    notes: document.getElementById("c-notes").value.trim() || null
  };
  const { error } = await sb.from("collabs").insert(payload);
  const toast = document.getElementById("collab-toast");
  if(error){
    toast.style.color = "#B23A5C";
    toast.textContent = "gagal simpan: " + error.message;
  } else {
    toast.style.color = "#7C8B6F";

    document.getElementById("c-status").value = "Received";

  }
};

async function loadCollabs(){
  const wrap = document.getElementById("collab-list");
  wrap.innerHTML = `<div class="empty">memuat collabs...</div>`;
  const { data, error } = await sb.from("collabs").select("*").order("post_date", { ascending: true, nullsFirst:false });
  if(error){
    wrap.innerHTML = `<div class="empty">gagal muat: ${error.message}</div>`;
    return;
  }
  if(!data || !data.length){
    wrap.innerHTML = `<div class="empty">belum ada collab dicatat</div>`;
    return;
  }
  wrap.innerHTML = "";
  data.forEach(c=>{
    const div = document.createElement("div");
    div.className = "product";
    const meta = [c.platform, c.status, c.post_date ? "post: "+c.post_date : null].filter(Boolean).join(" · ");
    const linkedBadge = c.product_id ? `<span style="font-family:'IBM Plex Mono', monospace; font-size:9.5px; padding:2px 7px; border-radius:5px; background:var(--sage); color:#fff; margin-left:6px;">linked</span>` : "";
    div.innerHTML = `
      <div>
        <div class="pname">${escapeHtml(c.product_name || c.brand)}${linkedBadge}</div>
        <div class="pmeta">${escapeHtml(c.brand)}${meta ? " · "+escapeHtml(meta) : ""}</div>
      </div>
      <div style="display:flex; align-items:flex-start;">
        <button class="sync-btn" style="font-family:'IBM Plex Mono', monospace; font-size:10px; padding:6px 10px; border-radius:6px; border:1px solid var(--clay-line); background:${c.calendar_event_id ? 'var(--sage)' : 'var(--paper)'}; color:${c.calendar_event_id ? '#fff' : 'var(--ink-soft)'}; cursor:pointer; white-space:nowrap;">
          ${c.calendar_event_id ? "✓ synced" : "Sync"}
        </button>
      </div>
    `;
    div.querySelector(".sync-btn").onclick = ()=>syncToCalendar(c);
    wrap.appendChild(div);
  });
}

startScanner();
loadBrandTypeLists();
